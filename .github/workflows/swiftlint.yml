name: SwiftLint

on:
  pull_request:
    paths:
      - '**/*.swift'
      - '.swiftlint.yml'
  push:
    # Every branch. This read [main, v1.1-beta] and was never updated as
    # development moved to v1.2, v1.3 and v1.4-beta — so with no PRs for our own
    # work, seven runs happened in the repo's whole history and two releases
    # shipped without CI ever linting them.
    branches: ['**']
    paths:
      - '**/*.swift'
      - '.swiftlint.yml'

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --reporter github-actions-logging
