# SwiftLint configuration for FindMySyncPlus

excluded:
  - .build

disabled_rules:
  - implicit_optional_initialization  # var x: T? = nil is fine
  - redundant_string_enum_value       # explicit enum raw values aid readability
  - opening_brace                     # conflicts with multi-line function signatures
  - multiple_closures_with_trailing_closure  # SwiftUI pattern

identifier_name:
  min_length: 1
  max_length: 60
  excluded:
    - id
  allowed_symbols:
    - _

line_length:
  warning: 150
  error: 200
  ignores_urls: true
  ignores_comments: true

file_length:
  warning: 600
  error: 1000

type_body_length:
  warning: 400
  error: 800

function_body_length:
  warning: 60
  error: 200

cyclomatic_complexity:
  warning: 15
  error: 40

nesting:
  type_level: 2
  function_level: 3
